name: Weekly 1 Collect Last Weeks Pick Data

on:
  # 5:00 AM Mountain Time every Tuesday. GitHub Actions cron is UTC-only with
  # no DST awareness, so both 5 AM Mountain UTC times are listed and the gate
  # job below runs only the one that matches today's DST state (the other is a
  # no-op). Weekly 1 is the head of the weekly chain (1 -> 2 -> 3b -> 4 -> 5 ->
  # 6 -> 7 -> 8 -> 9 -> 10 -> 11), so scheduling it here runs the whole chain.
  schedule:
    - cron: '0 11 * * 2'   # 05:00 Mountain Daylight Time (UTC-6)
    - cron: '0 12 * * 2'   # 05:00 Mountain Standard Time (UTC-7)
  # Also kick off the whole weekly chain whenever a Survivor World Championship
  # pick file is added or changed on main (e.g. a weekly upload). Pushes made
  # by this repo's own workflows use GITHUB_TOKEN, which by design does NOT
  # retrigger workflows, so weekly_3b writing normalized picks back into this
  # folder cannot loop back here.
  push:
    branches: [main]
    paths:
      - 'splash-world-championship-pick-history/**'
  workflow_dispatch: # Allows you to trigger it manually for testing

permissions:
  contents: write
  actions: write   # to dispatch the next step in the chain

jobs:
  # Only the schedule event is DST-gated; push and manual runs always proceed.
  gate:
    runs-on: ubuntu-latest
    outputs:
      proceed: ${{ steps.gate.outputs.proceed }}
    steps:
      - name: Decide whether to proceed
        id: gate
        env:
          EVENT_NAME: ${{ github.event_name }}
          TRIGGERING_CRON: ${{ github.event.schedule }}
        run: |
          python3 - <<'PYEOF'
          import datetime, os
          def is_us_daylight_time(d):
              # 2nd Sunday of March through the day before the 1st Sunday of
              # November -- rule unchanged since 2007, no tzdata dependency.
              march1 = datetime.date(d.year, 3, 1)
              first_sun_march = march1 + datetime.timedelta(days=(6 - march1.weekday()) % 7)
              second_sun_march = first_sun_march + datetime.timedelta(days=7)
              nov1 = datetime.date(d.year, 11, 1)
              first_sun_nov = nov1 + datetime.timedelta(days=(6 - nov1.weekday()) % 7)
              return second_sun_march <= d < first_sun_nov
          today = datetime.datetime.now(datetime.timezone.utc).date()
          is_dst = is_us_daylight_time(today)
          event = os.environ.get('EVENT_NAME', '')
          cron = os.environ.get('TRIGGERING_CRON', '')
          if event == 'schedule':
              expected = '0 11 * * 2' if is_dst else '0 12 * * 2'
              proceed = (cron == expected)
          else:
              proceed = True  # push or manual dispatch
          print(f"event={event} cron={cron!r} is_dst={is_dst} proceed={proceed}")
          with open(os.environ['GITHUB_OUTPUT'], 'a') as f:
              f.write(f"proceed={'true' if proceed else 'false'}\n")
          PYEOF

  collect-data:
    needs: gate
    if: ${{ needs.gate.outputs.proceed == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v5

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          pip install -r requirements.txt

      - name: Run Script
        run: python weekly_1_collect_last_weeks_pick_data.py

      - name: Commit and Push Changes
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"

          # Stage files — use || true so missing paths don't fail the step
          git add contest-historical-data/*.csv || true
          git add circa-pick-history/*.csv || true
          git add nfl-power-ratings/final_data/ || true

          # Commit only if there are changes
          git commit -m "Auto-update: Week $(date +'%U') Data" || echo "No changes to commit"

          git push

      - name: Hand off to Weekly 2
        if: success()
        env:
          GH_TOKEN: ${{ secrets.PIPELINE_PAT || github.token }}
        run: gh workflow run weekly_2_transactions.yml --ref main -R ${{ github.repository }}
