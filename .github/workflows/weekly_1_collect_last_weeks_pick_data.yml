name: Weekly 1 Collect Last Weeks Pick Data

on:
  # 09:00 UTC every Tuesday (fixed UTC — no DST handling). 09:00 UTC is 02:00
  # Mountain in winter (MST) / 03:00 Mountain in summer (MDT); it drifts by an
  # hour across the DST change, which is the trade-off for dropping the gate.
  # Weekly 1 is the head of the weekly chain (1 -> 2 -> 3b -> 4 -> 5 -> 6 -> 7
  # -> 8 -> 9 -> 10 -> 11), so scheduling it here runs the whole chain.
  schedule:
    - cron: '0 9 * * 2'
  # Also kick off the whole weekly chain whenever a Survivor World Championship
  # pick file is added or changed on main (e.g. a weekly upload). Pushes made
  # by this repo's own workflows use GITHUB_TOKEN, which by design does NOT
  # retrigger workflows, so weekly_3b writing normalized picks back into this
  # folder cannot loop back here.
  push:
    branches: [main]
    paths:
      - 'splash-world-championship-pick-history/**'
  workflow_dispatch: # Allows you to trigger it manually for testing

permissions:
  contents: write
  actions: write   # to dispatch the next step in the chain

jobs:
  collect-data:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v5

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          pip install -r requirements.txt

      - name: Run Script
        run: python weekly_1_collect_last_weeks_pick_data.py

      - name: Commit and Push Changes
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"

          # Stage files — use || true so missing paths don't fail the step
          git add contest-historical-data/*.csv || true
          git add circa-pick-history/*.csv || true
          git add nfl-power-ratings/final_data/ || true

          # Commit only if there are changes
          git commit -m "Auto-update: Week $(date +'%U') Data" || echo "No changes to commit"

          git push

      - name: Hand off to Weekly 2
        if: success()
        env:
          GH_TOKEN: ${{ secrets.PIPELINE_PAT || github.token }}
        run: |
          for i in 1 2 3 4 5; do
            if gh workflow run weekly_2_transactions.yml --ref main -R ${{ github.repository }}; then
              echo "Dispatched next step (attempt $i)."; exit 0
            fi
            echo "Dispatch failed (attempt $i; often a transient GitHub 500) — retrying in $((i*15))s..."
            sleep $((i*15))
          done
          echo "::error::Could not dispatch the next step after 5 attempts (check githubstatus.com, then Run workflow on it manually)."; exit 1
