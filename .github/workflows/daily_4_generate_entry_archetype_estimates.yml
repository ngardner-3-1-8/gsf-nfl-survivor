name: Daily 4 Generate Entry Archetype Pick Estimates

on:
  # Manual run button.
  workflow_dispatch:

  # Started by Daily 3's hand-off (gh workflow run), and hands off to Daily 5
  # when done. Each step dispatches the next, so there is no workflow_run
  # trigger.

permissions:
  contents: read    # estimates are handed to Daily 5 as an artifact, not committed
  actions: write    # to dispatch the next step in the chain

jobs:
  generate-estimates:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          pip install pandas numpy lightgbm joblib

      - name: Run Generate Entry Archetype Pick Estimates (all contests)
        # One run per contest via SURVIVOR_CONTEST -> each writes to its own
        # tagged output dir (entry_archetype_pick_estimates[_big_splash|
        # _world_championship]/{year}/...). daily_2's per-contest blend reads
        # these, so all three must run here. Circa is authoritative; the Splash
        # contests are best-effort so a not-yet-trained per-contest model or a
        # missing picks file doesn't block Circa.
        run: |
          echo "=== daily_4: circa ==="
          python daily_4_generate_entry_archetype_pick_estimates.py
          for contest in big_splash world_championship; do
            echo "=== daily_4: $contest ==="
            SURVIVOR_CONTEST=$contest python daily_4_generate_entry_archetype_pick_estimates.py \
              || echo "⚠️ daily_4 $contest produced no estimates (no model/picks yet?) — continuing"
          done

      - name: Ensure estimate dirs exist
        # So the upload never errors if a contest produced no output this run
        # (Circa is authoritative and always writes; Splash contests are
        # best-effort). One dir per contest.
        run: |
          mkdir -p entry_archetype_pick_estimates \
                   entry_archetype_pick_estimates_big_splash \
                   entry_archetype_pick_estimates_world_championship

      - name: Upload estimates artifact for Daily 5
        # Hand the per-entry archetype estimates to Daily 5 as a workflow
        # artifact instead of committing them to git. They're large (hundreds
        # of MB and growing) and ONLY Daily 5 reads them -- the deployed API
        # never does -- so committing them just bloated the repo and the
        # Railway image. Daily 5 downloads this by run id (passed in the
        # hand-off below).
        uses: actions/upload-artifact@v4
        with:
          name: daily4-entry-archetype-estimates
          path: |
            entry_archetype_pick_estimates/
            entry_archetype_pick_estimates_big_splash/
            entry_archetype_pick_estimates_world_championship/
          retention-days: 7
          if-no-files-found: warn

      - name: Hand off to Daily 5
        if: success()
        env:
          GH_TOKEN: ${{ secrets.PIPELINE_PAT || github.token }}
        run: |
          for i in 1 2 3 4 5; do
            if gh workflow run daily_5_apply_archetype_blend_and_ev.yml --ref main -R ${{ github.repository }} -f daily4_run_id=${{ github.run_id }}; then
              echo "Dispatched next step (attempt $i)."; exit 0
            fi
            echo "Dispatch failed (attempt $i; often a transient GitHub 500) — retrying in $((i*15))s..."
            sleep $((i*15))
          done
          echo "::error::Could not dispatch the next step after 5 attempts (check githubstatus.com, then Run workflow on it manually)."; exit 1
