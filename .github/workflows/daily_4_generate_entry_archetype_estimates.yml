name: Daily 4 Generate Entry Archetype Pick Estimates

on:
  # Manual run button.
  workflow_dispatch:

  # Started by Daily 3's hand-off (gh workflow run), and hands off to Daily 5
  # when done. Each step dispatches the next, so there is no workflow_run
  # trigger.

permissions:
  contents: write   # to commit the output CSVs back
  actions: write    # to dispatch the next step in the chain

jobs:
  generate-estimates:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          pip install pandas numpy lightgbm joblib

      - name: Run Generate Entry Archetype Pick Estimates (all contests)
        # One run per contest via SURVIVOR_CONTEST -> each writes to its own
        # tagged output dir (entry_archetype_pick_estimates[_big_splash|
        # _world_championship]/{year}/...). daily_2's per-contest blend reads
        # these, so all three must run here. Circa is authoritative; the Splash
        # contests are best-effort so a not-yet-trained per-contest model or a
        # missing picks file doesn't block Circa.
        run: |
          echo "=== daily_4: circa ==="
          python daily_4_generate_entry_archetype_pick_estimates.py
          for contest in big_splash world_championship; do
            echo "=== daily_4: $contest ==="
            SURVIVOR_CONTEST=$contest python daily_4_generate_entry_archetype_pick_estimates.py \
              || echo "⚠️ daily_4 $contest produced no estimates (no model/picks yet?) — continuing"
          done

      - name: Commit and Push Estimates
        # Output CSVs are small (one row per alive entry x candidate
        # team, per week), so these get committed directly rather than
        # uploaded as a workflow artifact.
        run: |
          git config --global user.name 'GitHub Action'
          git config --global user.email 'action@github.com'
          # mkdir first so `git add` never fails with "pathspec did not
          # match any files" if a run genuinely produces zero output for a
          # contest (e.g. no alive entries, no per-contest model yet, or the
          # sim file isn't out yet). One dir per contest.
          mkdir -p entry_archetype_pick_estimates \
                   entry_archetype_pick_estimates_big_splash \
                   entry_archetype_pick_estimates_world_championship
          git add entry_archetype_pick_estimates/ \
                  entry_archetype_pick_estimates_big_splash/ \
                  entry_archetype_pick_estimates_world_championship/
          git diff --cached --quiet || (git commit -m "Update entry archetype pick estimates (all contests)" && git push)

      - name: Hand off to Daily 5
        if: success()
        env:
          GH_TOKEN: ${{ secrets.PIPELINE_PAT || github.token }}
        run: gh workflow run daily_5_apply_archetype_blend_and_ev.yml --ref main -R ${{ github.repository }}
