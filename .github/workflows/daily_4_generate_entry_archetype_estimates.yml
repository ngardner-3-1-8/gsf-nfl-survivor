name: Daily 4 Generate Entry Archetype Pick Estimates

on:
  workflow_dispatch:
  schedule:
    # Tuesday through Saturday, 3pm Mountain time -- an hour after Train
    # Entry Pick Choice Model's Tuesday 2pm slot, so Tuesday's run always
    # has a freshly-retrained model to work from; Wed-Sat reuse whatever
    # model is currently committed and pick up the week's evolving
    # Public Pick % (Circa's live crowd consensus) as more people submit
    # picks through the week. No time was specified for this one, so
    # 3pm Mountain is a default -- easy to change if you'd rather a
    # different time.
    #
    # GitHub Actions cron is UTC-only with no DST awareness, but the NFL
    # season straddles the November US DST changeover, so "3pm Mountain"
    # isn't one fixed UTC time year-round. Both possible UTC times are
    # listed below for each day; the "Check schedule matches 3pm Mountain
    # time" step figures out which one is actually correct for today and
    # skips the run otherwise -- so this needs no manual adjustment, ever.
    - cron: '30 16 * * 2'  # Tue 3pm Mountain DAYLIGHT time (UTC-6)
    - cron: '30 16 * * 3'  # Wed
    - cron: '30 16 * * 4'  # Thu
    - cron: '30 16 * * 5'  # Fri
    - cron: '30 16 * * 6'  # Sat

permissions:
  contents: write   # to commit the output CSVs back

jobs:
  generate-estimates:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Set up Python
        if: steps.dst_check.outputs.proceed == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        if: steps.dst_check.outputs.proceed == 'true'
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          pip install pandas numpy lightgbm joblib

      - name: Run Generate Entry Archetype Pick Estimates
        if: steps.dst_check.outputs.proceed == 'true'
        run: |
          python daily_4_generate_entry_archetype_pick_estimates.py

      - name: Commit and Push Estimates
        if: steps.dst_check.outputs.proceed == 'true'
        # Output CSVs are small (one row per alive entry x candidate
        # team, per week), so these get committed directly rather than
        # uploaded as a workflow artifact.
        run: |
          git config --global user.name 'GitHub Action'
          git config --global user.email 'action@github.com'
          # mkdir first so `git add` never fails with "pathspec did not
          # match any files" if a run genuinely produces zero output
          # (e.g. no alive entries, or the sim file isn't out yet).
          mkdir -p entry_archetype_pick_estimates
          git add entry_archetype_pick_estimates/
          git diff --quiet && git diff --staged --quiet || (git commit -m "Update entry archetype pick estimates" && git push)
