name: Train Entry Pick Choice Model

on:
  # Manual-only, same as Build Entry Pick Training Data. Run this after
  # a successful run of that workflow (it pulls the latest training-data
  # artifact automatically -- no need to download/re-upload it yourself).
  workflow_dispatch:

permissions:
  contents: write   # to commit the trained model back
  actions: read      # to list/download the training-data workflow's artifact

jobs:
  train-model:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          pip install pandas numpy pyarrow lightgbm scikit-learn joblib

      - name: Download latest training data artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          run_id=$(gh run list \
            --workflow=build_entry_pick_training_data.yml \
            --status=success --limit=1 \
            --json databaseId --jq '.[0].databaseId')

          if [ -z "$run_id" ]; then
            echo "No successful 'Build Entry Pick Training Data' run found. Run that workflow first."
            exit 1
          fi

          echo "Downloading training data artifact from run $run_id"
          mkdir -p training_data
          gh run download "$run_id" -n entry-pick-choice-training-data -D training_data/
          ls -la training_data/

      - name: Run Entry Pick Choice Model Training
        run: |
          python entry_pick_choice_model_training.py

      - name: Commit and Push Model
        # The trained model (.pkl) and its feature metadata (.json) are
        # small compared to the training data, so these get committed
        # directly rather than uploaded as a workflow artifact.
        run: |
          git config --global user.name 'GitHub Action'
          git config --global user.email 'action@github.com'
          git add models/entry_pick_choice_model.pkl models/entry_pick_choice_model_features.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "Retrain entry pick choice model" && git push)
