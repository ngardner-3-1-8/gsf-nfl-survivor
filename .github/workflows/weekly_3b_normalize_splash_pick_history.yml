name: Weekly 3b Normalize Splash Pick History + Build Contest Historical Data

on:
  # Manual run button.
  workflow_dispatch:
  # Chain: run right after Weekly 2 finishes. This job does two things, in
  # order:
  #   1. weekly_3b converts the raw Splash contest exports into the canonical
  #      wide picks files (2026_big_splash_picks.csv /
  #      2026_world_championship_picks.csv) that the Splash runs of
  #      weekly_4 / weekly_5 read.
  #   2. build_contest_historical_data.py turns those picks (plus Circa's
  #      contest-agnostic game features) into each contest's historical
  #      training file (BigSplash_historical_data.csv /
  #      WorldChampionship_historical_data.csv) that daily_2's per-contest
  #      pick-% projection trains on.
  # It's the middle of the weekly chain (Weekly 1 -> 2 -> 3b -> 4 -> 5 -> 6),
  # so it no longer needs its own cron -- completion order guarantees it lands
  # before weekly_4/5, and its outputs are ready for the next daily_2 run.
  workflow_run:
    workflows: ["Weekly 2 Collect Transactions"]
    types: [completed]

permissions:
  contents: write   # to commit the normalized picks + contest historical files back

jobs:
  normalize-splash-picks:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # workflow_run fires on completion regardless of outcome, so only proceed
    # when Weekly 2 actually SUCCEEDED (or when triggered manually).
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          # Both scripts only read/write CSVs with pandas -- no scraping, ML,
          # or browser automation.
          pip install pandas

      - name: Run Normalize Splash Pick History
        run: |
          python weekly_3b_normalize_splash_pick_history.py

      - name: Build Per-Contest Historical Training Data
        # Depends on the normalized picks written by the previous step, so it
        # must run after weekly_3b. Rebuilds BigSplash_/WorldChampionship_
        # historical_data.csv (+ per-year splits) from those picks plus Circa's
        # game features -- the training input daily_2's projection reads.
        run: |
          python build_contest_historical_data.py

      - name: Commit and Push Normalized Picks + Contest Historical Data
        # These files are small and are INPUTS to daily_2 / weekly_4 / weekly_5
        # (which check out the repo fresh), so they must be committed to the
        # repo rather than uploaded as a workflow artifact. Only commits when
        # something actually changed (e.g. a new week's export was added).
        run: |
          git config --global user.name 'GitHub Action'
          git config --global user.email 'action@github.com'
          git add big-splash-pick-history/*_big_splash_picks.csv \
                  splash-world-championship-pick-history/*_world_championship_picks.csv \
                  contest-historical-data/BigSplash_historical_data*.csv \
                  contest-historical-data/WorldChampionship_historical_data*.csv
          git diff --quiet && git diff --staged --quiet || (git commit -m "Normalize Splash picks + rebuild per-contest historical data" && git push)
