name: Daily 3 Update Circa Survivor EVs

on:
  # Manual run button.
  workflow_dispatch:

  # Chain: run right after Daily 2 finishes, so EV is computed from Daily 2's
  # just-written pick %. No schedule of its own -- it rides whichever Daily 2
  # cascade fired it (the Daily 1 chain, or the 9 AM Mountain run).
  workflow_run:
    workflows: ["Daily 2 Consolidate and Predict Upcoming Weekly Data"]
    types: [completed]

permissions:
  contents: write # Required to push the new CSVs back to the repo

jobs:
  run-ev-script:
    runs-on: ubuntu-latest
    # workflow_run fires on completion regardless of outcome, so only proceed
    # when Daily 2 actually SUCCEEDED (or when triggered manually).
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10' # Adjust if you are using a different version locally
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # Installing the specific libraries imported in your script
          pip install requests beautifulsoup4 pandas numpy pytz python-dateutil \
                      scikit-learn tqdm ortools selenium undetected-chromedriver \
                      polars nflreadpy scipy

      - name: Run Daily 3 EV Calculation Script
        run: |
          # Replace 'get_ev.py' with the actual name of your python file
          python daily_3_calculate_ev.py

      - name: Commit and Push CSVs
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          
          # Stage the newly generated EV CSV files
          git add circa-survivor-ev/*_team_ev_week_*.csv nfl-power-ratings/*.csv
          
          # Only commit and push if there are actual changes
          if git diff-index --quiet HEAD; then
            echo "No new changes to commit."
          else
            git commit -m "Automated EV projections update"
            git push
          fi
