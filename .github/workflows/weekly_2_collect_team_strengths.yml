name: Weekly 2 Collect Team Strengths

on:
  schedule:
    # Runs at 2:30 PM UTC Daily
    #8:30 AM Mountain Standard Time
    #7:30 AM Mountain Daylight Time
    - cron: '30 14 * * 2'
  workflow_dispatch: # Allows manual testing button

jobs:
  weekly-strengths:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v5

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          pip install -r requirements.txt

      - name: Run Team Strengths Script
        run: python "weekly_2_collect_team_strengths.py"

      - name: Commit and Push Results
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          
          # Stage files in the expected output directories
          # (Wildcards protect us if the folder is empty or name varies slightly)
          git add nfl-pbp-data/*.csv
          git add nfl-power-ratings/*.csv
          
          # Commit only if there are changes
          git commit -m "Weekly Strengths Update: Week $(date +'%U')" || echo "No changes to commit"
          
          # Push back to repo
          git push
