name: Build Entry Pick Training Data

on:
  # No schedule -- this is a manual-only workflow. Run it from the
  # Actions tab whenever you want to (re)assemble the historical
  # choice-set training table (e.g. after adding/fixing a season's
  # files, or updating YEARS_TO_PROCESS in the script).
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-training-data:
    runs-on: ubuntu-latest
    # This script does a full python row-by-row pass across every
    # entry/week/candidate-team combination for every year in
    # YEARS_TO_PROCESS (currently 2020-2025) -- with ~25k entries/year
    # and up to 20 weeks, that's a lot of iterating, not just I/O. Give
    # it plenty of runway rather than let a slow year get killed by a
    # default timeout. Lower this once you've seen how long a real run
    # actually takes.
    timeout-minutes: 180
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          # build_entry_pick_training_data.py reads CSVs and writes a
          # Parquet file with pandas/numpy -- no scraping, no ML, no
          # browser automation. pyarrow is pandas' Parquet engine.
          pip install pandas numpy pyarrow

      - name: Run Build Entry Pick Training Data
        run: |
          python build_entry_pick_training_data.py

      - name: Upload Training Data Artifact
        # The assembled table across 6 seasons came out to 673MB as a
        # CSV -- well past GitHub's 100MB per-file repo limit, and not
        # something that belongs in git history anyway since it's fully
        # regenerable by re-running this workflow. As Parquet it should
        # be much smaller, but this uploads it as a workflow artifact
        # (not a git commit) either way, so a future size increase can't
        # break the push again. Download it from this run's summary page
        # (Artifacts section) once the run finishes.
        uses: actions/upload-artifact@v4
        with:
          name: entry-pick-choice-training-data
          path: training_data/entry_pick_choice_training_data.parquet
          retention-days: 90
          if-no-files-found: error
