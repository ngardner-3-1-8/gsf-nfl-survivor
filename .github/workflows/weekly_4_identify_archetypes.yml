name: Weekly 4 Identify Entry Archetypes

on:
  # Manual runs from the Actions tab (runs the full per-contest set).
  workflow_dispatch:
  # Chained: started by Weekly 3b's hand-off (gh workflow run), and hands off to
  # Weekly 5 when done. Each step dispatches the next, so there is no
  # workflow_run trigger to double-fire.

permissions:
  contents: write
  actions: write   # to dispatch the next step in the chain

jobs:
  identify-archetypes:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          # weekly_4 only reads/writes CSVs with pandas/numpy -- no scraping,
          # ML, or browser automation.
          pip install pandas numpy

      - name: Run Weekly 4 Identify Entry Archetypes (all contests)
        # One run per contest via SURVIVOR_CONTEST. Circa is authoritative
        # (its failure fails the job); the Splash contests are best-effort so a
        # season/week with no picks yet just skips without blocking the others.
        run: |
          echo "=== weekly_4: circa ==="
          python weekly_4_identify_entry_archetypes.py
          for contest in big_splash world_championship; do
            echo "=== weekly_4: $contest ==="
            SURVIVOR_CONTEST=$contest python weekly_4_identify_entry_archetypes.py \
              || echo "⚠️ weekly_4 $contest produced no output (no picks yet?) — continuing"
          done

      - name: Write timestamp
        run: |
          python3 -c "
          import json
          from datetime import datetime
          import pytz
          eastern = pytz.timezone('America/New_York')
          now = datetime.now(pytz.utc).astimezone(eastern)
          timestamp = now.strftime('%b %d, %Y at %I:%M %p ET')
          with open('entry_archetypes_last_updated.json', 'w') as f:
              json.dump({'archetypes_updated': timestamp}, f)
          "

      - name: Commit and Push Data
        # Commit every contest's archetype output (Circa keeps its original
        # filename; the Splash contests write into their own pick-history
        # folders). Scoped to the *_with_archetypes_week_* files so the raw
        # picks files aren't re-committed.
        run: |
          git config --global user.name 'GitHub Action'
          git config --global user.email 'action@github.com'
          git add circa-pick-history/*_with_archetypes_week_*.csv \
                  big-splash-pick-history/*_with_archetypes_week_*.csv \
                  splash-world-championship-pick-history/*_with_archetypes_week_*.csv \
                  entry_archetypes_last_updated.json
          if git diff --cached --quiet; then
            echo "No archetype changes to commit."
            exit 0
          fi
          git commit -m "Auto-update entry archetypes (all contests)"
          # Push with retries. GitHub occasionally returns a transient 500
          # ("remote: Internal Server Error") on a push; a plain single push
          # then fails the whole run. Retry with backoff, and re-sync with
          # --rebase between attempts so a non-fast-forward (another chained
          # workflow pushed meanwhile) is also recovered rather than fatal.
          n=0
          until [ "$n" -ge 5 ]; do
            if git push; then
              echo "Push succeeded."
              exit 0
            fi
            n=$((n + 1))
            echo "Push attempt $n failed; re-syncing and retrying in $((n * 15))s..."
            git pull --rebase --autostash origin main || true
            sleep $((n * 15))
          done
          echo "Push still failing after $n attempts (likely a GitHub-side 500 — check githubstatus.com, then re-run)."
          exit 1

      - name: Hand off to Weekly 5
        if: success()
        env:
          GH_TOKEN: ${{ secrets.PIPELINE_PAT || github.token }}
        run: |
          for i in 1 2 3 4 5; do
            if gh workflow run weekly_5_build_entry_pick_training_data.yml --ref main -R ${{ github.repository }}; then
              echo "Dispatched next step (attempt $i)."; exit 0
            fi
            echo "Dispatch failed (attempt $i; often a transient GitHub 500) — retrying in $((i*15))s..."
            sleep $((i*15))
          done
          echo "::error::Could not dispatch the next step after 5 attempts (check githubstatus.com, then Run workflow on it manually)."; exit 1
