name: Weekly 4 Identify Entry Archetypes

on:
  schedule:
    # Runs at 19:30 UTC every Tuesday
    # = 1:30 PM Mountain Daylight Time (UTC-6, roughly mid-Mar through early Nov)
    # = 12:30 PM Mountain Standard Time (UTC-7, roughly early Nov through mid-Mar)
    #
    # Matches the same convention as the Daily 2 workflow: one fixed UTC cron
    # time rather than a DST-adjusted pair, so this will literally run at
    # 1:30 PM Denver time through the first ~9 weeks of the season and then
    # drift to 12:30 PM Denver time for the rest of it once clocks fall back
    # in early November. If you'd rather it stay pinned to 1:30 PM local
    # year-round (the NFL season spans both the MDT and MST periods), say so
    # and this can be split into two cron entries with a guard step that
    # skips whichever one doesn't match the current Denver-local time.
    - cron: '0 15 * * 2'
  # Allows you to run this workflow manually from the Actions tab for testing
  workflow_dispatch:
permissions:
  contents: write
jobs:
  run-nfl-script:
    runs-on: ubuntu-latest
    steps:
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          # weekly_4_identify_entry_archetypes.py only reads/writes CSVs with
          # pandas -- no scraping, no ML, no browser automation -- so unlike
          # the Daily 2 job this doesn't need selenium/chrome/ortools/etc.
          pip install pandas numpy
      - name: Run Weekly 4 Identify Entry Archetypes
        run: |
          python weekly_4_identify_entry_archetypes.py
      - name: Write timestamp
        run: |
          python3 -c "
          import json
          from datetime import datetime
          import pytz
          eastern = pytz.timezone('America/New_York')
          now = datetime.now(pytz.utc).astimezone(eastern)
          timestamp = now.strftime('%b %d, %Y at %I:%M %p ET')
          # Separate file from Daily 2's last_updated.json -- that step does
          # a full overwrite (json.dump with mode 'w'), so writing to the
          # same filename here would wipe out its 'sim_updated' key instead
          # of adding to it.
          with open('entry_archetypes_last_updated.json', 'w') as f:
              json.dump({'archetypes_updated': timestamp}, f)
          "
      - name: Commit and Push Data
        # This step saves the generated CSV back to your repository
        run: |
          git config --global user.name 'GitHub Action'
          git config --global user.email 'action@github.com'
          # weekly_4 writes to circa-pick-history/{year}_survivor_picks_with_archetypes_week_{week}.csv
          git add circa-pick-history/*.csv entry_archetypes_last_updated.json
          # Check if there are changes before committing to avoid errors
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-update entry archetypes" && git push)
