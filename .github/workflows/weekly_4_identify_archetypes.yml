name: Weekly 4 Identify Entry Archetypes

on:
  # Manual runs from the Actions tab (runs the full per-contest set).
  workflow_dispatch:
  # Chained: runs automatically after weekly_3b finishes, so the normalized
  # Splash picks (and per-contest historical data) this step reads for the
  # Splash contests always exist first. No wall-clock coordination / DST math
  # needed -- ordering is guaranteed by completion, not by cron time.
  workflow_run:
    workflows: ["Weekly 3b Normalize Splash Pick History + Build Contest Historical Data"]
    types: [completed]

permissions:
  contents: write

jobs:
  identify-archetypes:
    runs-on: ubuntu-latest
    # workflow_run fires on completion regardless of outcome, so only proceed
    # when the upstream run actually SUCCEEDED (or when triggered manually).
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          # weekly_4 only reads/writes CSVs with pandas/numpy -- no scraping,
          # ML, or browser automation.
          pip install pandas numpy

      - name: Run Weekly 4 Identify Entry Archetypes (all contests)
        # One run per contest via SURVIVOR_CONTEST. Circa is authoritative
        # (its failure fails the job); the Splash contests are best-effort so a
        # season/week with no picks yet just skips without blocking the others.
        run: |
          echo "=== weekly_4: circa ==="
          python weekly_4_identify_entry_archetypes.py
          for contest in big_splash world_championship; do
            echo "=== weekly_4: $contest ==="
            SURVIVOR_CONTEST=$contest python weekly_4_identify_entry_archetypes.py \
              || echo "⚠️ weekly_4 $contest produced no output (no picks yet?) — continuing"
          done

      - name: Write timestamp
        run: |
          python3 -c "
          import json
          from datetime import datetime
          import pytz
          eastern = pytz.timezone('America/New_York')
          now = datetime.now(pytz.utc).astimezone(eastern)
          timestamp = now.strftime('%b %d, %Y at %I:%M %p ET')
          with open('entry_archetypes_last_updated.json', 'w') as f:
              json.dump({'archetypes_updated': timestamp}, f)
          "

      - name: Commit and Push Data
        # Commit every contest's archetype output (Circa keeps its original
        # filename; the Splash contests write into their own pick-history
        # folders). Scoped to the *_with_archetypes_week_* files so the raw
        # picks files aren't re-committed.
        run: |
          git config --global user.name 'GitHub Action'
          git config --global user.email 'action@github.com'
          git add circa-pick-history/*_with_archetypes_week_*.csv \
                  big-splash-pick-history/*_with_archetypes_week_*.csv \
                  splash-world-championship-pick-history/*_with_archetypes_week_*.csv \
                  entry_archetypes_last_updated.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-update entry archetypes (all contests)" && git push)
