name: Weekly 5 Build Entry Pick Training Data

on:
  # Manual runs from the Actions tab (builds the full per-contest set).
  workflow_dispatch:
  # Chained: runs after weekly_4 finishes. weekly_5 reads each contest's picks
  # (normalized by weekly_3b) and final_data; chaining off weekly_4 keeps the
  # whole Splash pipeline in order without any DST-aware cron juggling.
  workflow_run:
    workflows: ["Weekly 4 Identify Entry Archetypes"]
    types: [completed]

permissions:
  contents: read

jobs:
  build-training-data:
    runs-on: ubuntu-latest
    # Only proceed on a successful upstream run (or a manual dispatch).
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    # A full row-by-row pass across every entry/week/candidate-team for every
    # season on record, done once PER CONTEST -- give it plenty of runway.
    timeout-minutes: 180
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          # Reads CSVs, writes a Parquet file with pandas/numpy; pyarrow is
          # pandas' Parquet engine. No scraping/ML/browser automation.
          pip install pandas numpy pyarrow

      - name: Run Build Entry Pick Training Data (all contests)
        # One run per contest via SURVIVOR_CONTEST -> one tagged parquet each
        # (entry_pick_choice_training_data[_big_splash|_world_championship]
        # .parquet). Circa is authoritative; Splash contests are best-effort.
        run: |
          echo "=== weekly_5: circa ==="
          python weekly_5_build_entry_pick_training_data.py
          for contest in big_splash world_championship; do
            echo "=== weekly_5: $contest ==="
            SURVIVOR_CONTEST=$contest python weekly_5_build_entry_pick_training_data.py \
              || echo "⚠️ weekly_5 $contest produced no training data (no picks yet?) — continuing"
          done

      - name: Upload Training Data Artifact (all contests)
        # Uploads every contest's parquet as ONE artifact (the glob catches the
        # untagged Circa file plus the tagged Splash files). weekly_6 downloads
        # this artifact and trains one model per contest. Regenerable, so it's
        # an artifact rather than a git commit -- and never a repo-size risk.
        uses: actions/upload-artifact@v4
        with:
          name: entry-pick-choice-training-data
          path: training_data/entry_pick_choice_training_data*.parquet
          retention-days: 90
          if-no-files-found: error
