name: Weekly 6 Train Entry Pick Choice Model

on:
  # Started by Weekly 5's hand-off (gh workflow run), which passes the id of
  # the run whose training-data artifact to use. Also runnable manually (leave
  # the input blank to use the most recent successful Weekly 5 run). Each step
  # dispatches the next, so there is no workflow_run trigger.
  workflow_dispatch:
    inputs:
      weekly5_run_id:
        description: 'Weekly 5 run id to pull the training-data artifact from (blank = latest successful)'
        required: false
        default: ''

permissions:
  contents: write   # to commit the trained models back
  actions: write    # to download the training-data artifact AND dispatch the next step

jobs:
  train-model:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          pip install pandas numpy pyarrow lightgbm scikit-learn joblib

      - name: Download latest training data artifact
        env:
          GH_TOKEN: ${{ github.token }}
        # When chained, pull the artifact straight from the weekly_5 run that
        # triggered us (github.event.workflow_run.id) -- exact, no guessing.
        # On a manual dispatch there's no triggering run, so fall back to the
        # most recent successful weekly_5 run, referenced by its correct
        # workflow FILE name (the previous value pointed at a file that doesn't
        # exist, so the lookup always came back empty).
        run: |
          if [ -n "${{ inputs.weekly5_run_id }}" ]; then
            run_id="${{ inputs.weekly5_run_id }}"
          else
            run_id=$(gh run list \
              --workflow=weekly_5_build_entry_pick_training_data.yml \
              --status=success --limit=1 \
              --json databaseId --jq '.[0].databaseId')
          fi

          if [ -z "$run_id" ]; then
            echo "No successful 'Weekly 5 Build Entry Pick Training Data' run found. Run that workflow first."
            exit 1
          fi

          echo "Downloading training data artifact from run $run_id"
          mkdir -p training_data
          gh run download "$run_id" -n entry-pick-choice-training-data -D training_data/
          ls -la training_data/

      - name: Run Entry Pick Choice Model Training (all contests)
        # One run per contest via SURVIVOR_CONTEST -> one tagged model + feature
        # file each. Circa is authoritative; Splash contests are best-effort
        # (skip cleanly if their training parquet wasn't produced).
        run: |
          echo "=== weekly_6: circa ==="
          python weekly_6_entry_pick_choice_model_training.py
          for contest in big_splash world_championship; do
            echo "=== weekly_6: $contest ==="
            SURVIVOR_CONTEST=$contest python weekly_6_entry_pick_choice_model_training.py \
              || echo "⚠️ weekly_6 $contest did not train (no training data?) — continuing"
          done

      - name: Commit and Push Models (all contests)
        # Trained models (.pkl) + feature metadata (.json) are small, so they
        # commit directly. The globs catch the untagged Circa files plus the
        # tagged Splash ones.
        run: |
          git config --global user.name 'GitHub Action'
          git config --global user.email 'action@github.com'
          git add models/entry_pick_choice_model*.pkl \
                  models/entry_pick_choice_model_features*.json
          git diff --cached --quiet || (git commit -m "Retrain entry pick choice model (all contests)" && git push)

      - name: Hand off to Weekly 7
        if: success()
        env:
          GH_TOKEN: ${{ secrets.PIPELINE_PAT || github.token }}
        run: gh workflow run weekly_7_analyze_projection_horizon.yml --ref main -R ${{ github.repository }}
