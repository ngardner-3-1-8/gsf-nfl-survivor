name: Daily 2 Consolidate and Predict Upcoming Weekly Data

on:
  schedule:
    # Runs at 12:00 UTC every day (8:00 AM ET during Daylight Savings, 7:00 AM Standard)
    - cron: '30 2 * * *'
  # Allows you to run this workflow manually from the Actions tab for testing
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run-nfl-script:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          # Explicitly install packages if requirements.txt is missing
          pip install pandas numpy requests beautifulsoup4 scikit-learn tqdm ortools selenium undetected-chromedriver nflreadpy pytz polars lxml

      - name: Install Chrome (for Selenium)
        uses: browser-actions/setup-chrome@latest

      - name: Run Daily 2 Consolidate and Predict Upcoming Weekly Data
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
        run: |
          python daily_2_consolidate_predict_weekly_data.py

      - name: Commit and Push Data
        # This step saves the generated CSVs back to your repository
        run: |
          git config --global user.name 'GitHub Action'
          git config --global user.email 'action@github.com'
          # Add all CSV files (assuming your script outputs CSVs)
          git add *.csv nfl-schedules/*.csv contest-historical-data/*.csv nfl-power-ratings/*.csv
          
          # Check if there are changes before committing to avoid errors
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-update NFL data" && git push)
