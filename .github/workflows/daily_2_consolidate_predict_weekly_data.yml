name: Daily 2 Consolidate and Predict Upcoming Weekly Data

on:
  # Started by Daily 1's hand-off (gh workflow run), and hands off to Daily 3
  # when done. Each step dispatches the next, so there is no workflow_run
  # trigger. Also runnable manually.
  workflow_dispatch:

permissions:
  contents: write
  actions: write   # to dispatch the next step in the chain

jobs:
  # Decides whether this particular trigger should proceed:
  #   - manual dispatch            -> always
  #   - workflow_run (from Daily 1) -> only if Daily 1 SUCCEEDED
  #   - schedule                   -> only the 9 AM Mountain cron that matches
  #                                   today's DST state (the other is a no-op)
  gate:
    runs-on: ubuntu-latest
    outputs:
      proceed: ${{ steps.gate.outputs.proceed }}
    steps:
      - name: Decide whether to proceed
        id: gate
        run: |
          python3 - <<'PYEOF'
          import datetime, os

          def is_us_daylight_time(d):
              # 2nd Sunday of March through the day before the 1st Sunday of
              # November -- rule unchanged since 2007, no tzdata dependency.
              march1 = datetime.date(d.year, 3, 1)
              first_sun_march = march1 + datetime.timedelta(days=(6 - march1.weekday()) % 7)
              second_sun_march = first_sun_march + datetime.timedelta(days=7)
              nov1 = datetime.date(d.year, 11, 1)
              first_sun_nov = nov1 + datetime.timedelta(days=(6 - nov1.weekday()) % 7)
              return second_sun_march <= d < first_sun_nov

          today = datetime.datetime.now(datetime.timezone.utc).date()
          is_dst = is_us_daylight_time(today)
          event = os.environ.get('EVENT_NAME', '')
          cron = os.environ.get('TRIGGERING_CRON', '')
          conclusion = os.environ.get('RUN_CONCLUSION', '')

          if event == 'schedule':
              expected = '0 15 * * *' if is_dst else '0 16 * * *'
              proceed = (cron == expected)
          elif event == 'workflow_run':
              proceed = (conclusion == 'success')
          else:
              proceed = True  # manual dispatch

          print(f"event={event} cron={cron!r} conclusion={conclusion!r} "
                f"is_dst={is_dst} proceed={proceed}")
          with open(os.environ['GITHUB_OUTPUT'], 'a') as f:
              f.write(f"proceed={'true' if proceed else 'false'}\n")
          PYEOF
        env:
          EVENT_NAME: ${{ github.event_name }}
          TRIGGERING_CRON: ${{ github.event.schedule }}
          RUN_CONCLUSION: ${{ github.event.workflow_run.conclusion }}

  run-nfl-script:
    needs: gate
    if: ${{ needs.gate.outputs.proceed == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          # Explicitly install packages if requirements.txt is missing
          pip install pandas numpy requests beautifulsoup4 scikit-learn tqdm ortools selenium undetected-chromedriver nflreadpy pytz polars lxml

      - name: Install Chrome (for Selenium)
        uses: browser-actions/setup-chrome@latest

      - name: Run Daily 2 Consolidate and Predict Upcoming Weekly Data
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
        run: |
          python daily_2_consolidate_predict_weekly_data.py
      - name: Write timestamp
        run: |
          python3 -c "
          import json
          from datetime import datetime
          import pytz
          eastern = pytz.timezone('America/New_York')
          now = datetime.now(pytz.utc).astimezone(eastern)
          timestamp = now.strftime('%b %d, %Y at %I:%M %p ET')
          with open('last_updated.json', 'w') as f:
              json.dump({'sim_updated': timestamp}, f)
          "

      - name: Commit and Push Data
        # This step saves the generated CSVs back to your repository
        run: |
          git config --global user.name 'GitHub Action'
          git config --global user.email 'action@github.com'
          # Add all CSV files (assuming your script outputs CSVs)
          git add *.csv nfl-schedules/*.csv contest-historical-data/*.csv nfl-power-ratings/*.csv last_updated.json 
          git add entry-analytics/*.csv || true
          # Check if there are changes before committing to avoid errors
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-update NFL data" && git push)

      - name: Hand off to Daily 3
        if: success()
        env:
          GH_TOKEN: ${{ secrets.PIPELINE_PAT || github.token }}
        run: |
          for i in 1 2 3 4 5; do
            if gh workflow run daily_3_get_ev.yml --ref main -R ${{ github.repository }}; then
              echo "Dispatched next step (attempt $i)."; exit 0
            fi
            echo "Dispatch failed (attempt $i; often a transient GitHub 500) — retrying in $((i*15))s..."
            sleep $((i*15))
          done
          echo "::error::Could not dispatch the next step after 5 attempts (check githubstatus.com, then Run workflow on it manually)."; exit 1
