name: Daily 2 Consolidate and Predict Upcoming Weekly Data

on:
  schedule:
    # Runs at 8:30 AM UTC Daily
    #1:30 AM Mountain Standard Time
    #2:30 AM Mountain Daylight Time
    - cron: '30 8 * * *'
  # Allows you to run this workflow manually from the Actions tab for testing
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run-nfl-script:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          # Explicitly install packages if requirements.txt is missing
          pip install pandas numpy requests beautifulsoup4 scikit-learn tqdm ortools selenium undetected-chromedriver nflreadpy pytz polars lxml

      - name: Install Chrome (for Selenium)
        uses: browser-actions/setup-chrome@latest

      - name: Run Daily 2 Consolidate and Predict Upcoming Weekly Data
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
        run: |
          python daily_2_consolidate_predict_weekly_data.py
      - name: Write timestamp
        run: |
          python3 -c "
          import json
          from datetime import datetime
          import pytz
          eastern = pytz.timezone('America/New_York')
          now = datetime.now(pytz.utc).astimezone(eastern)
          timestamp = now.strftime('%b %d, %Y at %I:%M %p ET')
          with open('last_updated.json', 'w') as f:
              json.dump({'sim_updated': timestamp}, f)
          "

      - name: Commit and Push Data
        # This step saves the generated CSVs back to your repository
        run: |
          git config --global user.name 'GitHub Action'
          git config --global user.email 'action@github.com'
          # Add all CSV files (assuming your script outputs CSVs)
          git add *.csv nfl-schedules/*.csv contest-historical-data/*.csv nfl-power-ratings/*.csv last_updated.json          
          # Check if there are changes before committing to avoid errors
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-update NFL data" && git push)
