name: Weekly 9 Flavor Accuracy

# Manual study. Compares every pick-% projection flavor (Predicted / Top Down /
# Archetype) against the actual pick %, with a full accuracy battery (MAE, RMSE,
# bias, Pearson, Spearman, R²/calibration, top-1 & top-3 hit rates, and weekly
# head-to-head win rates). Reads the committed per-week Final_Data files; no
# model run, no re-backfill. Commits tables, a report, and per-contest charts
# under entry-analytics/.

on:
  workflow_dispatch:
    inputs:
      years:
        description: 'Space-separated years (blank = all available)'
        required: false
        default: ''
      contests:
        description: 'Space-separated contest keys (blank = all)'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  flavor_accuracy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas numpy scipy matplotlib

      - name: Run flavor accuracy analysis
        run: |
          ARGS=""
          if [ -n "${{ inputs.years }}" ];    then ARGS="$ARGS --years ${{ inputs.years }}"; fi
          if [ -n "${{ inputs.contests }}" ]; then ARGS="$ARGS --contests ${{ inputs.contests }}"; fi
          echo "weekly_9_flavor_accuracy.py $ARGS"
          python weekly_9_flavor_accuracy.py $ARGS

      - name: Commit the outputs
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add entry-analytics/flavor_accuracy.csv \
                  entry-analytics/flavor_accuracy_summary.csv \
                  entry-analytics/flavor_accuracy_report.txt \
                  entry-analytics/flavor_calibration_*.png \
                  entry-analytics/flavor_metrics_*.png 2>/dev/null || true
          git diff --cached --quiet || git commit -m "Pick-% flavor accuracy analysis

          Co-Authored-By: Claude Opus 4.8 <noreply@anthropic.com>
          Claude-Session: https://claude.ai/code/session_01UP4LjqY5SmZynhBYgsPMyG"
          git push || echo "Nothing to push"
