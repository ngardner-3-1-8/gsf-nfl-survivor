name: Daily 1 Get Internal Rankings

on:
  # 09:00 UTC on Wed/Thu/Fri/Sat (fixed UTC — no DST handling). 09:00 UTC is
  # 02:00 Mountain in winter (MST) / 03:00 Mountain in summer (MDT); it drifts
  # by an hour across the DST change, the trade-off for dropping the gate. To
  # run every day instead, change '3-6' to '*'. Daily 1 is the head of the
  # daily cascade (1 -> 2 -> 3 -> 4 -> 5).
  schedule:
    - cron: '0 9 * * 3-6'
  # Also runs whenever a week's MP ratings file is uploaded to main (a single
  # atomic commit, so this run always sees the complete file).
  push:
    branches: [main]
    paths:
      - 'nfl-power-ratings/mp_ratings_week_*_*.csv'
  # Also started by Weekly 11's hand-off (gh workflow run) as the daily cascade
  # that runs right after the weekly chain finishes -- that arrives as a
  # workflow_dispatch.
  workflow_dispatch: # Manual run button (and the Weekly 11 hand-off target)

permissions:
  contents: write
  actions: write   # to dispatch the next step in the chain

jobs:
  daily-rankings:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v5

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          pip install -r requirements.txt

      - name: Run Rankings Script
        run: python "daily_1_get_internal_rankings.py"

      - name: Commit and Push Results
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"

          # Stage CSVs and Images (png/jpg) if you are generating plots
          git add nfl-power-ratings/*.csv

          git commit -m "Daily Rankings Update: $(date +'%Y-%m-%d')" || echo "No changes to commit"
          git push

      - name: Hand off to Daily 2
        if: success()
        env:
          GH_TOKEN: ${{ secrets.PIPELINE_PAT || github.token }}
        run: |
          for i in 1 2 3 4 5; do
            if gh workflow run daily_2_consolidate_predict_weekly_data.yml --ref main -R ${{ github.repository }}; then
              echo "Dispatched next step (attempt $i)."; exit 0
            fi
            echo "Dispatch failed (attempt $i; often a transient GitHub 500) — retrying in $((i*15))s..."
            sleep $((i*15))
          done
          echo "::error::Could not dispatch the next step after 5 attempts (check githubstatus.com, then Run workflow on it manually)."; exit 1
