name: Daily 1 Get Internal Rankings

on:
  # Midnight Mountain Time every night. GitHub Actions cron is UTC-only with no
  # DST awareness and the NFL season straddles the November US DST change, so
  # both midnight-Mountain UTC times are listed; the gate job below runs only
  # the one that matches today's DST state (the other is a no-op). Daily 1 is
  # the head of the daily cascade (1 -> 2 -> 3 -> 4 -> 5).
  schedule:
    - cron: '0 6 * * 3'   # 00:00 Mountain Daylight Time (UTC-6)
    - cron: '0 7 * * 3'   # 00:00 Mountain Standard Time (UTC-7)

    - cron: '0 6 * * 4'   # 00:00 Mountain Daylight Time (UTC-6)
    - cron: '0 7 * * 4'   # 00:00 Mountain Standard Time (UTC-7)

    - cron: '0 6 * * 5'   # 00:00 Mountain Daylight Time (UTC-6)
    - cron: '0 7 * * 5'   # 00:00 Mountain Standard Time (UTC-7)

    - cron: '0 6 * * 6'   # 00:00 Mountain Daylight Time (UTC-6)
    - cron: '0 7 * * 6'   # 00:00 Mountain Standard Time (UTC-7)



  # Also started by Weekly 11's hand-off (gh workflow run) as the daily cascade
  # that runs right after the weekly chain finishes -- that arrives as a
  # workflow_dispatch, so no workflow_run trigger is needed.
  workflow_dispatch: # Manual run button (and the Weekly 11 hand-off target)

permissions:
  contents: write
  actions: write   # to dispatch the next step in the chain

jobs:
  # Proceed on: the midnight-Mountain cron that matches today's DST; or any
  # dispatch (manual, or the Weekly 11 hand-off).
  gate:
    runs-on: ubuntu-latest
    outputs:
      proceed: ${{ steps.gate.outputs.proceed }}
    steps:
      - name: Decide whether to proceed
        id: gate
        env:
          EVENT_NAME: ${{ github.event_name }}
          TRIGGERING_CRON: ${{ github.event.schedule }}
        run: |
          python3 - <<'PYEOF'
          import datetime, os
          def is_us_daylight_time(d):
              # 2nd Sunday of March through the day before the 1st Sunday of
              # November -- rule unchanged since 2007, no tzdata dependency.
              march1 = datetime.date(d.year, 3, 1)
              first_sun_march = march1 + datetime.timedelta(days=(6 - march1.weekday()) % 7)
              second_sun_march = first_sun_march + datetime.timedelta(days=7)
              nov1 = datetime.date(d.year, 11, 1)
              first_sun_nov = nov1 + datetime.timedelta(days=(6 - nov1.weekday()) % 7)
              return second_sun_march <= d < first_sun_nov
          today = datetime.datetime.now(datetime.timezone.utc).date()
          is_dst = is_us_daylight_time(today)
          event = os.environ.get('EVENT_NAME', '')
          cron = os.environ.get('TRIGGERING_CRON', '')
          if event == 'schedule':
              expected = '0 6 * * *' if is_dst else '0 7 * * *'
              proceed = (cron == expected)
          else:
              proceed = True  # manual dispatch or the Weekly 11 hand-off
          print(f"event={event} cron={cron!r} is_dst={is_dst} proceed={proceed}")
          with open(os.environ['GITHUB_OUTPUT'], 'a') as f:
              f.write(f"proceed={'true' if proceed else 'false'}\n")
          PYEOF

  daily-rankings:
    needs: gate
    if: ${{ needs.gate.outputs.proceed == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v5

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          pip install -r requirements.txt

      - name: Run Rankings Script
        run: python "daily_1_get_internal_rankings.py"

      - name: Commit and Push Results
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"

          # Stage CSVs and Images (png/jpg) if you are generating plots
          git add nfl-power-ratings/*.csv

          git commit -m "Daily Rankings Update: $(date +'%Y-%m-%d')" || echo "No changes to commit"
          git push

      - name: Hand off to Daily 2
        if: success()
        env:
          GH_TOKEN: ${{ secrets.PIPELINE_PAT || github.token }}
        run: |
          for i in 1 2 3 4 5; do
            if gh workflow run daily_2_consolidate_predict_weekly_data.yml --ref main -R ${{ github.repository }}; then
              echo "Dispatched next step (attempt $i)."; exit 0
            fi
            echo "Dispatch failed (attempt $i; often a transient GitHub 500) — retrying in $((i*15))s..."
            sleep $((i*15))
          done
          echo "::error::Could not dispatch the next step after 5 attempts (check githubstatus.com, then Run workflow on it manually)."; exit 1
