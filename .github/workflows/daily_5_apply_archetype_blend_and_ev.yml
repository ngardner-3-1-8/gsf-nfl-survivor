name: Daily 5 Apply Archetype Blend and EV

on:
  # Manual run button.
  workflow_dispatch:

  # Started by Daily 4's hand-off (gh workflow run) -- the tail of the daily
  # cascade. It folds Daily 4's per-contest archetype estimates into Daily 2's
  # projection (the blend) and recomputes true EV on the blended pick %. Its
  # commit/push to main is the last of the run; Railway auto-deploys on that
  # push, so the new data goes live without a separate deploy workflow.

permissions:
  contents: write   # to commit the reblended sim file / EV back

jobs:
  apply-blend-and-ev:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          # daily_5 imports daily_3_calculate_ev (for the true-EV engine), so it
          # needs daily_3's import-time deps even though it does no scraping/sim.
          pip install requests beautifulsoup4 pandas numpy pytz python-dateutil \
                      scikit-learn tqdm ortools selenium undetected-chromedriver \
                      polars nflreadpy scipy

      - name: Run Daily 5 Apply Archetype Blend and EV
        run: |
          python daily_5_apply_archetype_blend_and_ev.py

      - name: Commit and Push Reblended Sim + EV
        run: |
          git config --global user.name 'GitHub Action'
          git config --global user.email 'action@github.com'
          git add nfl-power-ratings/*.csv circa-survivor-ev/*_team_ev_week_*.csv
          git diff --cached --quiet || (git commit -m "Apply archetype blend + recompute EV (daily_5)" && git push)

      - name: Trigger a single Railway deploy
        if: success()
        # The whole run's data is now committed. Touch ONE dedicated trigger
        # file and push it as the final commit. Point Railway's watch path at
        # ONLY this file (railway-deploy-trigger.txt), so Daily 1-4 and the
        # weekly steps push data WITHOUT redeploying, and just this one push --
        # whose commit contains the complete, finished data -- triggers exactly
        # one Railway deploy per run. Ends the mid-run redeploy thrashing that
        # was restarting the API and breaking requests mid-flight.
        run: |
          git config --global user.name 'GitHub Action'
          git config --global user.email 'action@github.com'
          date -u +"%Y-%m-%dT%H:%M:%SZ" > railway-deploy-trigger.txt
          git add railway-deploy-trigger.txt
          git commit -m "Deploy trigger: Railway (end of daily cascade)"
          n=0
          until [ "$n" -ge 5 ]; do
            if git push; then echo "Pushed Railway deploy trigger."; exit 0; fi
            n=$((n + 1))
            echo "Push attempt $n failed; re-syncing and retrying in $((n * 15))s..."
            git pull --rebase --autostash origin main || true
            sleep $((n * 15))
          done
          echo "::error::Could not push the Railway deploy trigger after $n attempts."
          exit 1
