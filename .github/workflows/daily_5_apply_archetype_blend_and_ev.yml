name: Daily 5 Apply Archetype Blend and EV

on:
  # Started by Daily 4's hand-off (gh workflow run) -- the tail of the daily
  # cascade. Daily 4 passes the id of the run whose entry-archetype estimates
  # artifact to download (blank on a manual run = latest successful Daily 4).
  # Daily 5 folds those estimates into Daily 2's projection (the blend) and
  # recomputes true EV on the blended pick %. Its commit/push to main is the
  # last of the run; Railway auto-deploys on that push.
  workflow_dispatch:
    inputs:
      daily4_run_id:
        description: 'Daily 4 run id to pull the estimates artifact from (blank = latest successful)'
        required: false
        default: ''

permissions:
  contents: write   # to commit the reblended sim file / EV back
  actions: read     # to download Daily 4's estimates artifact

jobs:
  apply-blend-and-ev:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          # daily_5 imports daily_3_calculate_ev (for the true-EV engine), so it
          # needs daily_3's import-time deps even though it does no scraping/sim.
          pip install requests beautifulsoup4 pandas numpy pytz python-dateutil \
                      scikit-learn tqdm ortools selenium undetected-chromedriver \
                      polars nflreadpy scipy

      - name: Download entry-archetype estimates from Daily 4
        env:
          GH_TOKEN: ${{ github.token }}
        # Daily 4 hands these over as an artifact instead of committing them.
        # Pull from the exact Daily 4 run that triggered us (id passed as an
        # input); on a manual run, fall back to the most recent successful one.
        run: |
          if [ -n "${{ inputs.daily4_run_id }}" ]; then
            run_id="${{ inputs.daily4_run_id }}"
          else
            run_id=$(gh run list \
              --workflow=daily_4_generate_entry_archetype_estimates.yml \
              --status=success --limit=1 \
              --json databaseId --jq '.[0].databaseId')
          fi
          if [ -z "$run_id" ]; then
            echo "::error::No successful Daily 4 run found to pull estimates from. Run Daily 4 first."
            exit 1
          fi
          echo "Downloading estimates artifact from Daily 4 run $run_id"
          gh run download "$run_id" -n daily4-entry-archetype-estimates -D .
          echo "Downloaded estimate dirs:"; ls -d entry_archetype_pick_estimates* 2>/dev/null || echo "  (none found)"

      - name: Run Daily 5 Apply Archetype Blend and EV
        run: |
          python daily_5_apply_archetype_blend_and_ev.py

      - name: Commit and Push Reblended Sim + EV
        run: |
          git config --global user.name 'GitHub Action'
          git config --global user.email 'action@github.com'
          git add nfl-power-ratings/*.csv circa-survivor-ev/*_team_ev_week_*.csv
          git diff --cached --quiet || (git commit -m "Apply archetype blend + recompute EV (daily_5)" && git push)

      - name: Trigger a single Railway deploy
        if: success()
        # The whole run's data is now committed. Touch ONE dedicated trigger
        # file and push it as the final commit. Point Railway's watch path at
        # ONLY this file (railway-deploy-trigger.txt), so Daily 1-4 and the
        # weekly steps push data WITHOUT redeploying, and just this one push --
        # whose commit contains the complete, finished data -- triggers exactly
        # one Railway deploy per run. Ends the mid-run redeploy thrashing that
        # was restarting the API and breaking requests mid-flight.
        run: |
          git config --global user.name 'GitHub Action'
          git config --global user.email 'action@github.com'
          date -u +"%Y-%m-%dT%H:%M:%SZ" > railway-deploy-trigger.txt
          git add railway-deploy-trigger.txt
          git commit -m "Deploy trigger: Railway (end of daily cascade)"
          n=0
          until [ "$n" -ge 5 ]; do
            if git push; then echo "Pushed Railway deploy trigger."; exit 0; fi
            n=$((n + 1))
            echo "Push attempt $n failed; re-syncing and retrying in $((n * 15))s..."
            git pull --rebase --autostash origin main || true
            sleep $((n * 15))
          done
          echo "::error::Could not push the Railway deploy trigger after $n attempts."
          exit 1
