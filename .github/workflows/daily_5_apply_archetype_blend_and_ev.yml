name: Daily 5 Apply Archetype Blend and EV

on:
  # Manual run button.
  workflow_dispatch:

  # Started by Daily 4's hand-off (gh workflow run) -- the lean tail of the
  # daily cascade. When it finishes it hands off to the Railway deploy. Each
  # step dispatches the next, so there is no workflow_run trigger. It folds
  # Daily 4's per-contest archetype estimates into Daily 2's projection (the
  # blend) and recomputes true EV on the blended pick %.

permissions:
  contents: write   # to commit the reblended sim file / EV back
  actions: write    # to dispatch the Railway deploy

jobs:
  apply-blend-and-ev:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          # daily_5 imports daily_3_calculate_ev (for the true-EV engine), so it
          # needs daily_3's import-time deps even though it does no scraping/sim.
          pip install requests beautifulsoup4 pandas numpy pytz python-dateutil \
                      scikit-learn tqdm ortools selenium undetected-chromedriver \
                      polars nflreadpy scipy

      - name: Run Daily 5 Apply Archetype Blend and EV
        run: |
          python daily_5_apply_archetype_blend_and_ev.py

      - name: Commit and Push Reblended Sim + EV
        run: |
          git config --global user.name 'GitHub Action'
          git config --global user.email 'action@github.com'
          git add nfl-power-ratings/*.csv circa-survivor-ev/*_team_ev_week_*.csv
          git diff --cached --quiet || (git commit -m "Apply archetype blend + recompute EV (daily_5)" && git push)

      - name: Hand off to Railway deploy
        if: success()
        env:
          GH_TOKEN: ${{ secrets.PIPELINE_PAT || github.token }}
        run: gh workflow run deploy-railway.yml --ref main -R ${{ github.repository }}
