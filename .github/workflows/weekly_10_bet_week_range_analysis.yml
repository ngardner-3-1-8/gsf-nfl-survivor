name: Weekly 10 Bet Week-Range Analysis

# Identifies which parts of the season each bet type performs best/worst.
# Pools realized Win/Loss across all historical seasons by NFL week, then
# auto-detects contiguous strong / average / weak week ranges per bet type and
# writes entry-analytics/bet_week_range_analysis.json for the Bets tab to read.
# Runs weekly (and on demand) — the UI reads the committed JSON, it is never
# computed on page load.

on:
  workflow_dispatch:
    inputs:
      years:
        description: 'Space-separated seasons to include (blank = all available)'
        required: false
        default: ''
  # Chained: started by Weekly 9's hand-off (gh workflow run), and hands off to
  # Weekly 11 when done. Its own standalone Tuesday cron was removed so it only
  # runs as part of the chain (headed by Weekly 1 at 5 AM MT Tuesday); it is
  # driven by the explicit hand-off, so there is no workflow_run trigger.

permissions:
  contents: write
  actions: write   # to dispatch the next step in the chain

jobs:
  bet-week-range:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas numpy

      - name: Run week-range analysis
        run: |
          ARGS=""
          if [ -n "${{ inputs.years }}" ]; then ARGS="--years ${{ inputs.years }}"; fi
          echo "weekly_10_bet_week_range_analysis.py $ARGS"
          python weekly_10_bet_week_range_analysis.py $ARGS

      - name: Commit the output
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add entry-analytics/bet_week_range_analysis.json 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "No change to week-range analysis."
            exit 0
          fi
          git commit -m "Update bet week-range analysis

          Co-Authored-By: Claude Opus 4.8 <noreply@anthropic.com>
          Claude-Session: https://claude.ai/code/session_01UP4LjqY5SmZynhBYgsPMyG"
          n=0
          until [ "$n" -ge 5 ]; do
            if git push; then echo "Pushed."; exit 0; fi
            n=$((n + 1))
            echo "Push attempt $n failed; re-syncing and retrying in $((n * 15))s..."
            git pull --rebase --autostash origin main || true
            sleep $((n * 15))
          done
          echo "Push still failing after $n attempts."
          exit 1

      - name: Hand off to Weekly 11
        if: success()
        env:
          GH_TOKEN: ${{ secrets.PIPELINE_PAT || github.token }}
        run: gh workflow run weekly_11_bet_edge_performance.yml --ref main -R ${{ github.repository }}
