name: Weekly 2 Collect Transactions

on:
  # Manual run button.
  workflow_dispatch:
  # Chain: run right after Weekly 1 finishes. Weekly 1 stays the scheduled head
  # of the weekly chain; 2 -> 3b -> 4 -> 5 -> 6 then run in order off each
  # other, so this needs no cron of its own.
  workflow_run:
    workflows: ["Weekly 1 Collect Last Weeks Pick Data"]
    types: [completed]

permissions:
  contents: write

jobs:
  weekly-transactions:
    runs-on: ubuntu-latest
    # workflow_run fires on completion regardless of outcome, so only proceed
    # when Weekly 1 actually SUCCEEDED (or when triggered manually).
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v5

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          # weekly_2_collect_transactions.py reads/writes CSVs with pandas/numpy
          # and pulls transactions via nflreadpy -- no scraping/ML/browser.
          pip install pandas numpy nflreadpy

      - name: Run Transactions Script
        run: python "weekly_2_collect_transactions.py"

      - name: Commit and Push Results
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          # Outputs: nfl-transactions/{year}_transactions.csv and
          # {year}_team_deltas.csv (the manual_* files are hand-maintained
          # inputs, but committing them back is harmless if unchanged).
          git add nfl-transactions/*.csv || true
          git commit -m "Weekly Transactions Update: Week $(date +'%U')" || echo "No changes to commit"
          git push
