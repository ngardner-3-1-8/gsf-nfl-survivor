name: Weekly 2 Collect Transactions

on:
  # Manual run button.
  workflow_dispatch:
  # Chained: started by Weekly 1's hand-off (gh workflow run). Each step
  # dispatches the next, so the cascade doesn't depend on workflow_run
  # auto-triggering (GitHub throttles that for GITHUB_TOKEN-driven runs, which
  # stalled the chain a few hops in).

permissions:
  contents: write
  actions: write   # to dispatch the next step in the chain

jobs:
  weekly-transactions:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v5

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          # weekly_2_collect_transactions.py reads/writes CSVs with pandas/numpy
          # and pulls transactions via nflreadpy -- no scraping/ML/browser.
          pip install pandas numpy nflreadpy

      - name: Run Transactions Script
        run: python "weekly_2_collect_transactions.py"

      - name: Commit and Push Results
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          # Outputs: nfl-transactions/{year}_transactions.csv and
          # {year}_team_deltas.csv (the manual_* files are hand-maintained
          # inputs, but committing them back is harmless if unchanged).
          git add nfl-transactions/*.csv || true
          git commit -m "Weekly Transactions Update: Week $(date +'%U')" || echo "No changes to commit"
          git push

      - name: Hand off to Weekly 3b
        if: success()
        env:
          GH_TOKEN: ${{ secrets.PIPELINE_PAT || github.token }}
        run: |
          for i in 1 2 3 4 5; do
            if gh workflow run weekly_3b_normalize_splash_pick_history.yml --ref main -R ${{ github.repository }}; then
              echo "Dispatched next step (attempt $i)."; exit 0
            fi
            echo "Dispatch failed (attempt $i; often a transient GitHub 500) — retrying in $((i*15))s..."
            sleep $((i*15))
          done
          echo "::error::Could not dispatch the next step after 5 attempts (check githubstatus.com, then Run workflow on it manually)."; exit 1
